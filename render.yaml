# Render Blueprint —— 静态站点（Static Site）
# 使用方式：Render 控制台 → New → Blueprint → 连接本 GitHub 仓库
#
# 为什么用 Static Site 而不是 Web Service：
#   本游戏是纯前端（无后端、无数据库），构建产物只是一堆静态文件。
#   Free Web Service 15 分钟无流量会休眠、唤醒需数十秒（冷启动），
#   而 Static Site 由 CDN 边缘节点直接分发，**没有休眠与冷启动**，
#   面试官任何时候点开链接都是秒开。

services:
  - type: web
    name: hollow-depths
    runtime: static
    repo: https://github.com/X-ABT/hollow-depths
    branch: main
    # 用 npm install 而非 npm ci：npm ci 每次都会删光并重装 node_modules，
    # 而 Render 会为构建保留 node_modules 缓存，npm install 能复用缓存大幅提速；
    # package-lock.json 仍在提交中，可复现性依然有保障。
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      # 构建产物带 content hash，可安全长缓存（immutable）
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      # HTML 入口不缓存，保证发版后立刻生效
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
    routes:
      # 单页应用：任意路径回退到 index.html
      - type: rewrite
        source: /*
        destination: /index.html
